include "#!./gradlew -q composeApp:printConveyorConfig"
include "stdlib/jdk/21/amazon.conf"

app {
    machines = [windows.amd64, linux.aarch64, linux.arm64, mac.aarch64]

    display-name = "Chirp"
    fsname = "chirp"
    vendor = "Mobidev Studio"
    description = "Chirp chat application"
    version = "1.0.0"
    rdns-name = "com.example.chirpappkmp"

    url-schemes = ["chirp"]

    icons = "conveyorResources/logo.png"

    inputs += "composeApp/build/libs/composeApp-desktop-1.0.0.jar"

    single-instance = true

    license = "MIT"
    copyright = "© 2026 Mobidev Studio"
    vcs-url = "https://github.com/M0bileDev/ChirpAppDesktopKMP"

    site.base-url = "https://mobidev.studio.com/chirp/downloads"
    updates = none

    jvm {
        main-class = "com.example.chirpappkmp.MainKt"
        gui.main-class = "com.example.chirpappkmp.MainKt"

        version = 21

        options = [
            "-Xmx2g",
            "--add-opens=java.base/sun.misc=ALL-UNNAMED",
            "--add-opens=java.base/java.nio=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt.wl=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt.X11=ALL-UNNAMED",
        ]

        modules = [
            java.desktop,
            java.logging,
            java.prefs,
            java.sql,
            jdk.unsupported
        ]
    }

    mac {
        info-plist {
            "com.apple.developers.associated-domains" = [
                "applinks:chirp.pl-coding.com"
            ]
        }
    }

    windows.manifest.application.extensions = [
        {
            category = "windows.appUriHandler",
            host = "chirp.pl-coding.com"
        }
    ]
}

linux {
    installer-type = "deb"
    applications-menu = true

    desktop-file {
        Name = "Chirp"
        Type = "Application"
        Exec = "chirp %u"
        categories = ["Network", "Chat"]
        keywords = ["chat", "messaging", "chirp"]
        mime-type = ["x-scheme-handler/chirp"]
    }
}

windows {
    installer-type = "msix"
    start-menu = true
    desktop = true
    console = false
    certificate = "self-signed"
}

conveyor {
    compatibility-level = 19
    billing-email = "mobidev@studio.com"
}